aid: involve-asia
name: Involve Asia
description: >-
  Involve Asia (Involve Asia Technologies Sdn. Bhd.) is a leading affiliate and
  partnership-marketing network across Southeast Asia and Taiwan, connecting
  advertisers with publishers and creators to grow revenue through performance
  marketing. Its public Publisher API lets publishers programmatically pull
  conversion (commission) data, browse offers and campaigns, generate trackable
  affiliate deeplinks, and access Shopee Commission Xtra boosted-payout brands —
  without logging into the dashboard. The API is REST over HTTPS with bearer-JWT
  auth (2-hour token TTL), form-urlencoded requests, page-number pagination, a
  60 requests/minute throttle, and a 1,000-link rolling 30-day deeplink cap.
  Involve Asia publishes first-party machine-readable artifacts: an OpenAPI 3.1
  spec, a Claude Skill, an llms.txt, and a Postman collection.
